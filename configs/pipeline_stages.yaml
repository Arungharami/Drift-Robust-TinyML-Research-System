       results/embedded/stage14_manifest.csv, results/embedded/stage14_preprocessing_equivalence.csv]
    git_commit: WORKTREE
    depends_on: ["13"]
    notes: >-
      EXP-EMBED-FP32-EQUIV-001 completed with scientific outcome FAILED. C1 and C4 passed score,
      probability, normalization, golden decision, and boundary decision checks but failed frozen
      preprocessing criteria. Host-compiled validation only; quantization and MCU work remain unexecuted.


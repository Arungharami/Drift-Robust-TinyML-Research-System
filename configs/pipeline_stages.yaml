# Version-controlled pipeline-stage registry consumed by scripts/portal/export_evidence.py.
# This is the ONLY place stage status is declared — the web app never hardcodes it.
# Status vocabulary matches src/portal evidence loader: EXECUTED, PLANNED, RUNNING, FAILED,
# BLOCKED, NOT_EXECUTED. Update this file, then re-run export_evidence.py, whenever a stage's
# real state changes — never edit the exported JSON by hand.

stages:
  - id: "00"
    name: Environment and reproducibility
    status: EXECUTED
    notebook: notebooks/00_environment_and_reproducibility.ipynb
    script: scripts/capture_environment.py
    artifact_paths: [results/reproducibility/environment.json]
    git_commit: c2e2d1a1fc0e20e3169d61f594e5938dffe9cb29
    depends_on: []
    notes: Captures Python/OS/package versions, git commit, and seed for every subsequent stage.

  - id: "01"
    name: Dataset acquisition / integrity
    status: EXECUTED
    notebook: notebooks/01_dataset_audit_and_drift_characterization.ipynb
    script: scripts/download_dataset.py
    artifact_paths: [data/raw]
    git_commit: c2e2d1a1fc0e20e3169d61f594e5938dffe9cb29
    depends_on: ["00"]
    notes: Official UCI archive downloaded and SHA-256 verified against the published archive hash.

  - id: "02"
    name: Dataset validation
    status: EXECUTED
    notebook: notebooks/01_dataset_audit_and_drift_characterization.ipynb
    script: scripts/validate_dataset.py
    artifact_paths:
      [results/reproducibility/dataset_validation.json, results/reproducibility/dataset_validation.md]
    git_commit: c2e2d1a1fc0e20e3169d61f594e5938dffe9cb29
    depends_on: ["01"]
    notes: Verified 13,910 samples, 128 features, 10 batches, 6 classes; 0 missing values.

  - id: "03"
    name: Chronological split definition
    status: EXECUTED
    notebook: null
    script: src/data
    artifact_paths: [configs/chronological_protocol.yaml]
    git_commit: c2e2d1a1fc0e20e3169d61f594e5938dffe9cb29
    depends_on: ["02"]
    notes: FIXED_ORIGIN (train batch 1, test 2-10), EXPANDING_WINDOW, and IID_DIAGNOSTIC protocols frozen in config.

  - id: "04"
    name: Preprocessing
    status: EXECUTED
    notebook: notebooks/02_classical_chronological_baselines.ipynb
    script: src/data
    artifact_paths: []
    git_commit: 5a9fd6204ec7d0becf6b95cbab2071075a3ff5ae
    depends_on: ["03"]
    notes: Standardization fitted on training data only per protocol; no leakage across chronological boundary.

  - id: "05"
    name: Baseline model training
    status: EXECUTED
    notebook: notebooks/02_classical_chronological_baselines.ipynb
    script: scripts/run_classical_baselines.py
    artifact_paths:
      [artifacts/models/BASE-FIXED-C1-001.joblib, artifacts/models/BASE-FIXED-C2-001.joblib,
       artifacts/models/BASE-FIXED-C3-001.joblib, artifacts/models/BASE-FIXED-C4-001.joblib]
    git_commit: 5a9fd6204ec7d0becf6b95cbab2071075a3ff5ae
    depends_on: ["04"]
    notes: Logistic Regression, Random Forest, RBF-SVM, MLP trained on Batch 1 (seed 42).

  - id: "06"
    name: Chronological evaluation
    status: EXECUTED
    notebook: notebooks/02_classical_chronological_baselines.ipynb
    script: scripts/run_classical_baselines.py
    artifact_paths:
      [results/baselines/fixed_origin_metrics.csv, results/baselines/expanding_window_metrics.csv,
       results/baselines/iid_diagnostic_metrics.csv]
    git_commit: 5a9fd6204ec7d0becf6b95cbab2071075a3ff5ae
    depends_on: ["05"]
    notes: All 4 models evaluated on batches 2-10 under FIXED_ORIGIN, EXPANDING_WINDOW, and IID_DIAGNOSTIC.

  - id: "07"
    name: Drift analysis
    status: EXECUTED
    notebook: notebooks/01_dataset_audit_and_drift_characterization.ipynb
    script: scripts/run_drift_analysis.py
    artifact_paths: [results/drift/feature_drift_by_batch.csv, results/drift/global_drift_by_batch.csv]
    git_commit: c2e2d1a1fc0e20e3169d61f594e5938dffe9cb29
    depends_on: ["02"]
    notes: Per-feature and global drift (normalized Wasserstein, standardized mean shift) vs. Batch 1.

  - id: "08"
    name: Evidence-based model selection
    status: EXECUTED
    notebook: notebooks/03_temporal_adaptation_and_iid_diagnostic.ipynb
    script: scripts/build_baseline_artifacts.py
    artifact_paths: [results/baselines/fixed_origin_summary.csv, paper/claim_evidence_matrix.csv]
    git_commit: 9ede9dd8f3b2c8b9e6f6b0e0b3f6b0e0b3f6b0e0
    depends_on: ["06", "07"]
    notes: Claim-evidence matrix (paper/claim_evidence_matrix.csv) links each candidate claim to its artifact; C006 explicitly UNSUPPORTED.

  - id: "09"
    name: Resource-aware XAI
    status: EXECUTED
    notebook: notebooks/05_resource_aware_xai.ipynb
    script: src/xai/run_stage09.py
    artifact_paths:
      [artifacts/explanations/EXP-XAI-0001, results/xai/stage09_global_importance.csv,
       results/xai/stage09_reduced_explanations.csv, results/xai/stage09_local_samples.csv,
       results/xai/stage09_local_explanations.csv, results/xai/stage09_fidelity_prep.csv,
       results/xai/stage09_manifest.csv, results/xai/stage09_feature_map.csv]
    git_commit: a2bfa8a
    depends_on: ["08"]
    notes: >-
      EXP-XAI-0001 (registry rows EXP-XAI-0001-C1..C4). Intrinsic coefficient explanations for
      MODEL-C1, intrinsic impurity for MODEL-C2, model-agnostic permutation importance
      (macro-F1) and single-feature-ablation local explanations for all 4 frozen FIXED_ORIGIN
      models. No retraining; chronological split unchanged. Full applicability matrix in
      results/xai/stage09_manifest.csv. See docs/experiments/STAGE09_RESOURCE_AWARE_XAI.md.
      This stage prepares evidence for Stages 10-12 — it does not itself report fidelity,
      stability, or latency conclusions.

  - id: "10"
    name: Fidelity evaluation
    status: EXECUTED
    notebook: null
    script: src/xai/run_stage10.py
    artifact_paths:
      [artifacts/explanations/EXP-FID-0001, results/xai/stage10_fidelity_per_sample.csv,
       results/xai/stage10_fidelity_summary.csv]
    git_commit: 54ab3e7711324187d99a476ff25958ac9f2e6996
    depends_on: ["09"]
    notes: >-
      EXP-FID-0001 evaluated 880 frozen Stage 09 model/sample/top-k combinations and produced
      16 model/top-k summaries. Metrics are descriptive: rank overlap, prediction preservation,
      target-probability closeness, absolute sufficiency gap, and comprehensiveness drop.
      MODEL-C1 compares intrinsic coefficients with the ablation reference; MODEL-C2-C4 reuse
      the ablation ranking, so their identity is not independent corroboration. No pass/fail
      fidelity threshold was preregistered. See docs/experiments/STAGE10_EXPLANATION_FIDELITY.md.

  - id: "11"
    name: Explanation stability evaluation
    status: EXECUTED
    notebook: null
    script: src/xai/run_stage11.py
    artifact_paths:
      [artifacts/explanations/EXP-STAB-0001, results/xai/stage11_stability_pairwise.csv,
       results/xai/stage11_stability_summary.csv]
    git_commit: d571b4301819db27fce1eba9485edac0eb58645d
    depends_on: ["09"]
    notes: >-
      EXP-STAB-0001 compared global permutation-importance explanations across batches 2-10:
      36 batch-2 reference comparisons (including 4 self-checks) plus 32 adjacent comparisons.
      Across batches 3-10, mean Spearman correlation to batch 2 ranged 0.027-0.322 by model,
      and every model had zero top-1 Jaccard overlap with batch 2. Descriptive only; no stability
      threshold was preregistered. See docs/experiments/STAGE11_EXPLANATION_STABILITY.md.

  - id: "12"
    name: Explanation latency
    status: EXECUTED
    notebook: null
    script: src/xai/run_stage12.py
    artifact_paths:
      [artifacts/explanations/EXP-LAT-0001, results/xai/stage12_host_latency_raw.csv,
       results/xai/stage12_host_latency_summary.csv]
    git_commit: fca7eef8424991d9ce8a8aa75400d824b619d591
    depends_on: ["09"]
    notes: >-
      EXP-LAT-0001 records 540 host-side timings on one captured shared GitHub runner. Median
      vectorized local-ablation latency was 0.834 ms (C1), 81.815 ms (C2), 2.263 ms (C3), and
      1.166 ms (C4). These are comparative host measurements, not nRF52840/on-device timing;
      physical latency remains Stage 17.


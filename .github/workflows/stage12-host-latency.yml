name: Stage 12 Host Explanation Latency
on:
  push:
    branches: [agent/stage12-host-latency]
    paths: [.github/workflows/stage12-host-latency.yml, configs/xai/stage12_host_latency_v1.yaml, src/xai/run_stage12.py, tests/test_xai_latency.py]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: |
          pytest -q tests/test_xai_latency.py
          python -m src.xai.run_stage12 --config configs/xai/stage12_host_latency_v1.yaml --check-config
      - run: python scripts/download_dataset.py
      - run: python -m src.xai.run_stage12 --config configs/xai/stage12_host_latency_v1.yaml
      - name: Validate evidence
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          m=json.loads(Path("artifacts/explanations/EXP-LAT-0001/manifest.json").read_text())
          assert m["status"]=="EXECUTED" and m["host_only"] is True and m["n_raw_rows"]==540 and m["n_summary_rows"]==9
          assert sum(1 for _ in csv.DictReader(Path("results/xai/stage12_host_latency_raw.csv").open()))==540
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-host-latency-evidence
          retention-days: 90
          path: |
            results/xai/stage12_host_latency_raw.csv
            results/xai/stage12_host_latency_summary.csv
            artifacts/explanations/EXP-LAT-0001/
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/xai/stage12_host_latency_raw.csv results/xai/stage12_host_latency_summary.csv artifacts/explanations/EXP-LAT-0001/
          git commit -m "Record executed Stage 12 host latency evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

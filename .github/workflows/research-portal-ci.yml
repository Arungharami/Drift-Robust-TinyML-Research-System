name: Research Portal CI
on:
  push:
    paths:
      - "research-portal/**"
      - ".github/workflows/research-portal-ci.yml"
  pull_request:
    paths:
      - "research-portal/**"
      - ".github/workflows/research-portal-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: research-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

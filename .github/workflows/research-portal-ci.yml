name: Research Portal CI

on:
  pull_request:
    paths:
      - "research-portal/**"
      - ".github/workflows/research-portal-ci.yml"
  push:
    branches:
      - main
    paths:
      - "research-portal/**"
      - ".github/workflows/research-portal-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: research-portal/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check portal
        run: npm run typecheck

      - name: Lint portal
        run: npm run lint

      - name: Build portal
        run: npm run build

class_handling: macro metrics use labels present in each chronological batch
exclusions: [methods marked NOT_APPLICABLE in Stage 09, absent local sample-method pairs, K larger than ranking]
success_conditions: [all inputs hash, all models load without fitting, applicable combinations produce rows, validation passes]
failure_conditions: [missing frozen artifact, unavailable saved scaler mean, unsupported method evaluated, future statistic used]
software_environment: artifacts/explanations/EXP-XAI-0001/environment.json
expected_outputs: [results/xai/stage10_input_manifest.csv, results/xai/stage10_fidelity_global.csv, results/xai/stage10_fidelity_local.csv, results/xai/stage10_fidelity_sensor_groups.csv, results/xai/stage10_fidelity_feature_families.csv, results/xai/stage10_random_controls.csv, results/xai/stage10_bootstrap_ci.csv, results/xai/stage10_fidelity_summary.csv, results/xai/stage10_manifest.csv]
